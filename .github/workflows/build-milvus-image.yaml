# Build Milvus binary & Milvus runtime image (arm64 / ubuntu22.04) — manual trigger
#
# Mirrors the official Milvus release pipeline (ci/jenkins/PublishImages.groovy):
#   1. Compile the Milvus binary INSIDE the official builder image
#      milvusdb/milvus-env:ubuntu22.04-<DATE_VERSION> via build/builder.sh
#      "make install". The standard official toolchain lives in this image, and
#      all official build parameters are preserved, including the jemalloc
#      setting DMILVUS_JEMALLOC_LG_PAGE in scripts/core_build.sh. Your modified
#      jemalloc parameters live in this branch's source, so they are picked up
#      automatically.
#   2. Assemble the runtime image with build/build_image.sh, which uses
#      build/docker/milvus/ubuntu22.04/Dockerfile. The official runtime
#      parameters (LD_PRELOAD=...:/milvus/lib/libjemalloc.so,
#      MALLOC_CONF=background_thread:true) are taken from that Dockerfile —
#      including your branch's modifications.
#   3. Package the built image as <tag>.tar.gz and upload it as a workflow
#      artifact for download. No registry push occurs (GHCR/Docker Hub disabled).
#
# Scope (per requirement):
#   - Target architecture is arm64 only.
#   - Milvus container OS is ubuntu22.04.
#
# Why ubuntu22.04 and not ubuntu20.04:
#   The official milvus-env builder images are published for ubuntu22.04 /
#   ubuntu24.04 only. There is NO ubuntu20.04 milvus-env tag, and therefore no
#   arm64 builder for ubuntu20.04. Building on an arm64 runner requires the
#   ubuntu22.04 (or 24.04) arm64 builder image, which DOES exist and ships the
#   standard toolchain. Branch_v2.5.19 itself defaults to OS_NAME=ubuntu22.04.
#
# Arm64 pitfall (why DOCKER_DEFAULT_PLATFORM=linux/arm64 is required):
#   The branch-pinned milvus-env (DATE_VERSION from .env) has an *inactive*
#   arm64 manifest on Docker Hub. Without forcing the platform, `docker compose
#   pull` silently falls back to the amd64 builder, which then runs under QEMU;
#   that x86_64 GCC has no `arm_sve.h`, so knowhere fails with
#   "arm_sve.h: No such file or directory". Forcing linux/arm64 (plus the
#   self-healing fallback to the active 20260714-c135601 arm64 image) guarantees
#   a native arm64 toolchain where arm_sve.h is present.
#
# Two-layer architecture note (important):
#   - GitHub runner (the VM that runs this workflow): ubuntu-24.04-arm, a native
#     ARM64 hosted runner. GitHub provides ARM64 runners (ubuntu-24.04-arm /
#     ubuntu-22.04-arm), free & unlimited for public repos. No QEMU emulation is
#     needed.
#   - Milvus builder/runtime container OS: ubuntu22.04 (the milvus-env image and
#     the runtime Dockerfile). This is independent of the runner image; it runs
#     inside Docker on the ARM64 runner.
#
# Trigger: GitHub -> Actions -> "Build Milvus & Milvus Image" -> Run workflow.
name: Build Milvus & Milvus Image

on:
  workflow_dispatch:
    inputs:
      milvus_ref:
        description: 'Milvus branch / tag / ref to build (based on v2.5.19)'
        required: true
        default: 'Branch_v2.5.19'
        type: string
      image_repo:
        description: 'Local image repo name used to tag the built image (also drives the tar.gz filename). No registry push occurs.'
        required: true
        default: 'milvusdb/milvus'
        type: string
      image_tag:
        description: 'Image tag. Leave empty for auto: <ref>-<date>-<sha>'
        required: false
        default: ''
        type: string
      builder_date_version:
        description: 'Optional override for the milvus-env builder DATE_VERSION (arm64). Leave empty to use the branch-pinned version. Use 20260714-c135601 only if the pinned one has no arm64 manifest.'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: write   # required by actions/upload-artifact@v4 (no registry push happens)

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.milvus_ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Milvus (arm64 / ubuntu22.04)
    # Native ARM64 hosted runner. If your plan does not include ubuntu-24.04-arm,
    # replace with a self-hosted arm64 runner label, e.g. [self-hosted, ARM64].
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    env:
      # Fixed per requirement: ubuntu22.04 (the only ubuntu with an arm64
      # milvus-env builder), arm64 only.
      OS_NAME: ubuntu22.04
      IMAGE_ARCH: arm64
      MILVUS_IMAGE_REPO: ${{ github.event.inputs.image_repo }}
      DOCKER_BUILDKIT: 1
      # CRITICAL for arm64: force the arm64 image and forbid any amd64 fallback.
      # The branch-pinned milvus-env (DATE_VERSION from .env) has an *inactive*
      # arm64 manifest on Docker Hub; without this, `docker compose pull` silently
      # falls back to the amd64 builder (run via QEMU), whose x86_64 GCC has no
      # `arm_sve.h` -> knowhere fails with "arm_sve.h: No such file or directory".
      DOCKER_DEFAULT_PLATFORM: linux/arm64
      # Host directory mounted into the builder container for ccache / go module
      # caches (matches build/builder.sh defaults, on an absolute path so it can
      # be cached by actions/cache).
      DOCKER_VOLUME_DIRECTORY: ${{ github.workspace }}/.docker

    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 10240
          overprovision-lvm: 'true'
          swap-size-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Checkout ${{ github.event.inputs.milvus_ref }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.milvus_ref }}
          fetch-depth: 0

      # build/builder.sh sources .env, which hardcodes OS_NAME / IMAGE_ARCH /
      # DATE_VERSION. Force OS_NAME=ubuntu22.04 and IMAGE_ARCH=arm64 so the
      # builder image tag and the runtime Dockerfile path are correct. Keep the
      # branch's DATE_VERSION (the builder image version) unless an override is
      # supplied.
      - name: Configure .env (ubuntu22.04 / arm64)
        run: |
          sed -i "s/^OS_NAME=.*/OS_NAME=ubuntu22.04/" .env
          sed -i "s/^IMAGE_ARCH=.*/IMAGE_ARCH=arm64/" .env
          if [ -n "${{ github.event.inputs.builder_date_version }}" ]; then
            sed -i "s/^DATE_VERSION=.*/DATE_VERSION=${{ github.event.inputs.builder_date_version }}/" .env
            sed -i "s/^LATEST_DATE_VERSION=.*/LATEST_DATE_VERSION=${{ github.event.inputs.builder_date_version }}/" .env
          fi
          echo "---- .env ----"
          cat .env

      - name: Cache builder caches (ccache / go modules)
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.docker/arm64-ubuntu22.04-ccache
            ${{ github.workspace }}/.docker/arm64-ubuntu22.04-go-mod
          key: milvus-ubuntu22.04-arm64-${{ github.sha }}
          restore-keys: |
            milvus-ubuntu22.04-arm64-

      - name: Compute image tag
        id: tag
        run: |
          REF="${{ github.event.inputs.milvus_ref }}"
          DATE=$(date +%Y%m%d)
          SHA=$(git rev-parse --short=7 HEAD)
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            TAG="${{ github.event.inputs.image_tag }}"
          else
            # Sanitize any '/' in the ref so the tag / tar.gz filename stays path-safe.
            TAG="${REF//\//-}-${DATE}-${SHA}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Generated image tag: ${TAG}"

      # Step 1 — pull the official builder image, then build the binary inside it.
      # The build ALREADY runs inside milvus-env (via build/builder.sh ->
      # `docker compose run builder`), which carries the standard toolchain.
      # IS_NETWORK_MODE_HOST=true matches the official release build and lets the
      # container reach Go proxy / conan. The dirty-tag sed mirrors
      # PublishImages.groovy.
      #
      # Self-healing: try the branch-pinned builder image first; if its arm64
      # manifest is unavailable, fall back to a known-good active arm64 builder
      # so the workflow still succeeds.
      - name: Pull builder image (official milvus-env)
        run: |
          if ! build/builder.sh pull; then
            echo "::warning::Branch-pinned milvus-env arm64 image unavailable; falling back to 20260714-c135601"
            sed -i "s/^DATE_VERSION=.*/DATE_VERSION=20260714-c135601/" .env
            sed -i "s/^LATEST_DATE_VERSION=.*/LATEST_DATE_VERSION=20260714-c135601/" .env
            build/builder.sh pull
          fi

      - name: Verify arm64 native toolchain (diagnostic)
        run: |
          build/builder.sh /bin/bash -c "echo ARCH=\$(uname -m); gcc -dumpmachine; if ls /usr/lib/gcc/*/*/include/arm_sve.h >/dev/null 2>&1; then echo 'arm_sve.h OK'; else echo 'arm_sve.h MISSING'; fi"

      - name: Build Milvus binary (official builder image)
        run: |
          sed -i 's/--dirty="-dev"//g' Makefile || true
          export IS_NETWORK_MODE_HOST="true"
          build/builder.sh /bin/bash -c "make install"

      # Step 2 — assemble the runtime image using the official Dockerfile.
      - name: Build Milvus runtime image
        id: image
        run: |
          export MILVUS_IMAGE_TAG="${{ steps.tag.outputs.tag }}-arm64"
          export BUILD_ARGS="--build-arg TARGETARCH=arm64"
          build/build_image.sh
          echo "ref=${MILVUS_IMAGE_REPO}:${{ steps.tag.outputs.tag }}-arm64" >> "$GITHUB_OUTPUT"

      # Step 3 — package the built image as tar.gz and upload as an artifact.
      - name: Save image as tar.gz
        id: save
        run: |
          IMAGE_REF="${{ steps.image.outputs.ref }}"
          FILENAME="milvus-image-${{ steps.tag.outputs.tag }}-arm64.tar.gz"
          echo "Saving ${IMAGE_REF} -> ${FILENAME}"
          docker save "${IMAGE_REF}" | gzip -9 > "${FILENAME}"
          ls -lh "${FILENAME}"
          echo "filename=${FILENAME}" >> "$GITHUB_OUTPUT"

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: milvus-image-arm64-${{ github.run_id }}
          path: ${{ steps.save.outputs.filename }}
          retention-days: 14
          compression-level: 0   # already gzipped; no extra compression needed

      - name: Show built image info
        if: ${{ always() }}
        run: |
          docker image inspect "${MILVUS_IMAGE_REPO}:${{ steps.tag.outputs.tag }}-arm64" \
            --format 'id={{.Id}} arch={{.Architecture}} os={{.Os}}' || true
          docker images "${MILVUS_IMAGE_REPO}:${{ steps.tag.outputs.tag }}-arm64" || true
